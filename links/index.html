<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Blip brand tokens v1 (from ~/Findaball/brand/tokens/tokens.css). Swap brand values HERE. -->
<style>
:root{
  --blue:#1034A6; --blue-deep:#0A1F6B; --blue-wash:#DCE4F7; --blue-light:#9DB0F0;
  --white:#FFFFFF; --mist:#F4F6F8; --mist-2:#E9EDF2; --line:#D3D9E2; --slate:#4E5868; --ink:#121A24; --ink-2:#1E2833;
  --font-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --font-sans:"Atkinson Hyperlegible Next",system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,monospace;
  --radius-sm:8px; --radius-md:20px; --radius-pill:999px;
  --shadow-ball:0 24px 60px rgba(18,26,36,.12);
}
</style>
<title>Blip Golf links: Kickstarter, Indiegogo, build videos</title>
<meta name="description" content="Blip Golf links: get notified when the Blip golf ball finder launches on Kickstarter, back it on Indiegogo, watch the build and join the waitlist.">
<link rel="canonical" href="https://blipgolf.com/links/">
<meta name="theme-color" content="#F4F6F8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Blip Golf">
<meta property="og:url" content="https://blipgolf.com/links/">
<meta property="og:title" content="Blip Golf: walk to the dot">
<meta property="og:description" content="Kickstarter, Indiegogo, build videos and the waitlist for Blip, the golf ball finder for iPhone.">
<meta property="og:image" content="https://blipgolf.com/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://blipgolf.com/assets/og-image.png">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon-180.png">
<link rel="preload" href="../assets/fonts/barlow-semi-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Barlow Semi Condensed"; src: url("../assets/fonts/barlow-semi-condensed-800.woff2") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../assets/fonts/atkinson-next.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("../assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;position:relative;min-height:100svh;overflow-x:hidden;background:var(--mist);color:var(--ink);font:400 1.0625rem/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;isolation:isolate}
::selection{background:var(--blue);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
/* brand motif: the dimpled ball rising behind the lower half, thin grey edge */
.field{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.ball{position:absolute;left:50%;top:max(44%,400px);width:max(150vw,760px);aspect-ratio:1;transform:translateX(-36%);border-radius:50%;background-color:var(--white);background-image:radial-gradient(circle,#D5DBE3 1.7px,transparent 2.3px),radial-gradient(circle,#D5DBE3 1.7px,transparent 2.3px);background-size:26px 44px;background-position:0 0,13px 22px;border:1.5px solid #E1E5EA;box-shadow:-24px -18px 70px rgba(18,26,36,.06)}
.page{max-width:460px;margin:0 auto;padding:56px 20px 28px;display:flex;flex-direction:column;align-items:center;min-height:100svh;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:var(--shadow-ball)}
.avatar img{width:100%;height:100%;display:block}
h1{font:800 1.5rem/1.1 var(--font-display);margin:16px 0 6px}
.bio{margin:0 0 28px;color:var(--slate);font-size:1rem}
.list{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:14px}
.lnk{display:flex;align-items:center;justify-content:center;min-height:60px;padding:14px 20px;border-radius:var(--radius-pill);background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:1.0625rem;box-shadow:0 10px 24px -14px rgba(10,31,107,.6);transition:transform .18s cubic-bezier(.16,1,.3,1),background-color .18s}
.lnk:hover{transform:translateY(-2px);background:var(--blue-deep)}
.lnk:active{transform:scale(.98)}
.icons{display:flex;gap:28px;margin-top:32px}
.icons a{color:var(--ink);display:grid;place-items:center;min-width:44px;min-height:44px}.icons a:hover{color:var(--blue)}
.icons svg{width:28px;height:28px;display:block}
.band{margin-top:auto;width:100vw;height:56px;background:var(--blue);flex:none}
.foot{padding-top:18px;font:500 .75rem/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.001ms!important}}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",

  "url": "https://blipgolf.com/links/",
  "name": "Blip Golf links",
  "mainEntity": {
    "@type": "Organization",
    "@id": "https://blipgolf.com/#org",
    "name": "Blip Golf",
    "url": "https://blipgolf.com/",
    "sameAs": [
      "https://www.tiktok.com/@blipgolf",
      "https://www.instagram.com/blipgolf/",
      "https://www.youtube.com/@blipgolf",
      "https://www.kickstarter.com/projects/804464871/1559624511",
      "https://www.indiegogo.com/projects/findaball/blip"
    ]
  }
}
</script>

</head>
<body>
<div class="field" aria-hidden="true"><div class="ball"></div></div>
<main class="page">
  <span class="avatar"><img src="../assets/logo-mark.svg" alt="Blip Golf" width="96" height="96"></span>
  <h1>@blipgolf</h1>
  <p class="bio">Golf ball finder for iPhone. Mark it. Snap it. Find it.</p>
  <ul class="list">
    <li><a class="lnk" data-link="kickstarter" href="https://www.kickstarter.com/projects/804464871/1559624511" rel="noopener">Get the $79 early-bird price</a></li>
    <li><a class="lnk" data-link="indiegogo" href="https://www.indiegogo.com/projects/findaball/blip" rel="noopener">Follow Blip on Indiegogo</a></li>
    <li><a class="lnk" href="../">See how Blip finds your ball</a></li>
  </ul>
  <nav class="icons" aria-label="Social">
    <a data-social="tiktok" href="https://www.tiktok.com/@blipgolf" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8a4.3 4.3 0 0 1-1-2.8h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.8 5.8 0 1 0 5 5.7V9.1a7.4 7.4 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.4-1.6z"/></svg></a>
    <a data-social="instagram" href="https://www.instagram.com/blipgolf/" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a data-social="youtube" href="https://www.youtube.com/@blipgolf" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg></a>
  </nav>
  <div class="band" aria-hidden="true"></div>
  <footer class="foot">&copy; 2026 Blip Golf / built in public</footer>
</main>
<script>
var UTM='utm_source=bio&utm_medium=social&utm_campaign=prelaunch';
var LINKS={kickstarter:'https://www.kickstarter.com/projects/804464871/1559624511',indiegogo:'https://www.indiegogo.com/projects/findaball/blip'};
document.querySelectorAll('[data-link]').forEach(function(a){var u=LINKS[a.getAttribute('data-link')];if(u)a.href=u+'?'+UTM;});
</script>
</body>
</html>
